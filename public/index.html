<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surreal Investigate</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Surreal Investigate</h1>
    <p class="muted">Build local investigation caches, index with SurrealDB, then ask questions.</p>

    <section class="card">
      <h2>OpenRouter</h2>
      <div class="row">
        <input id="or-key" placeholder="OpenRouter API key" type="password" />
        <input id="or-model" placeholder="Model (e.g. google/gemini-2.0-flash-001)" />
        <button id="save-or">Save</button>
        <button id="ping-or">Ping</button>
      </div>
      <p>Status: <span id="or-dot" class="dot red"></span> <span id="or-status">Not checked</span></p>
    </section>

    <section class="card">
      <h2>Caches</h2>
      <div class="row">
        <input id="cache-label" placeholder="New cache label" />
        <button id="create-cache">Create Cache</button>
      </div>
      <ul id="cache-list"></ul>
    </section>

    <section class="card">
      <h2>Upload</h2>
      <div class="row">
        <select id="cache-select"></select>
        <input id="file-input" type="file" multiple />
        <button id="upload-btn">Upload</button>
        <button id="load-sample">Load Sample File</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Supported</th></tr></thead>
        <tbody id="file-preview"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Index</h2>
      <div class="row">
        <button id="index-btn">Create / Refresh Index</button>
      </div>
      <p><strong id="ready-state">Not ready for questions</strong></p>
      <pre id="index-log" class="log"></pre>
    </section>

    <section class="card">
      <h2>Ask Questions</h2>
      <div class="row">
        <select id="query-mode">
          <option value="surreal">Surreal only</option>
          <option value="ai">Surreal + AI</option>
        </select>
        <input id="question" placeholder="Ask about parties, money movement, relationships..." />
        <button id="ask-btn">Ask</button>
      </div>
      <pre id="answer" class="log"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
